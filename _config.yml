# Site settings
title: Mylium
email: info@mylium.eu
description: >  # this means to ignore newlines until "baseurl:"
 FPGA solutions
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://mylium.eu" # the base hostname & protocol for your site
google_analytics: G-9GBTGG0QQR

twitter_username:
github_username:

# Build settings
markdown: kramdown
sass:
  style: compressed

# Include tools directory
include:
  - tools

# Exclude node_modules and other unnecessary files
exclude:
  - node_modules
  - vendor
  - .git
  - .continue
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE
  - img/photos/CREDITS.md
