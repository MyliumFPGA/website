---
layout: default
---
<article class="page">
    <div class="container container--narrow">
        <header class="page__header">
            {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
            <h1>{{ page.title }}</h1>
            {% if page.updated %}<p class="page__meta">Last updated: {{ page.updated | date: "%-d %B %Y" }}</p>{% endif %}
        </header>
        <div class="prose">
            {{ content }}
        </div>
    </div>
</article>
