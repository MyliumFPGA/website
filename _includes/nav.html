{%- assign home = '/' | relative_url -%}
{%- if page.url == '/' -%}{%- assign home = '' -%}{%- endif -%}
<nav class="nav" id="mainNav" aria-label="Main">
    <div class="container nav__inner">
        <a class="nav__brand" href="{{ '/' | relative_url }}#page-top" aria-label="Mylium, back to top">
            <img src="{{ '/img/brand/mark.svg' | relative_url }}" alt="" width="34" height="34">
            <img class="nav__wordmark" src="{{ '/img/brand/wordmark-light.svg' | relative_url }}" alt="Mylium" width="106" height="20">
        </a>

        <button class="nav__toggle" type="button" aria-controls="navMenu" aria-expanded="false">
            <span class="sr-only">Open menu</span>
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
        </button>

        <div class="nav__menu" id="navMenu">
            <ul class="nav__links">
                <li><a href="{{ home }}#page-top">Home</a></li>
                <li><a href="{{ home }}#capabilities">Capabilities</a></li>
            </ul>
            <a class="btn btn--primary btn--sm nav__cta" href="{{ home }}#contact">Contact</a>
        </div>
    </div>
</nav>
