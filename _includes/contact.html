<section id="contact" class="section">
    <div class="container contact reveal">
        <span class="eyebrow">Get in touch</span>
        <h2>Let's build your next mission system</h2>
        <p>Planning a defense or dual-use program with demanding on-board processing? Speak with our engineering team about scope, architecture and delivery.</p>
        <a class="btn btn--primary btn--lg" href="mailto:{{ site.email }}?subject={{ 'Schedule a conversation' | url_encode | replace: '+', '%20' }}" data-mail>Schedule a conversation</a>
        <div class="contact__fallback" role="status" hidden>
            <span class="contact__address">{{ site.email }}</span>
            <button type="button" class="btn btn--ghost btn--sm" data-copy="{{ site.email }}">Copy</button>
        </div>
    </div>
</section>
