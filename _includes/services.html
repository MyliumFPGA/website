<section id="capabilities" class="section">
    <div class="container">
        <div class="section__header reveal">
            <span class="eyebrow">What we do</span>
            <h2>Sovereign compute for defense &amp; dual-use</h2>
        </div>

        <div class="grid grid--4">
            {% for item in site.data.capabilities %}
            <article class="card capability reveal">
                <img class="card__image" src="{{ '/img/photos/' | append: item.image | append: '.webp' | relative_url }}" alt="" width="800" height="534" loading="lazy">
                <div class="card__icon">{% include icon.html name=item.icon %}</div>
                <h3>{{ item.title }}</h3>
                <p>{{ item.summary }}</p>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
