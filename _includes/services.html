<section id="capabilities" class="section">
    <div class="container">
        <div class="section__header reveal">
            <span class="eyebrow">What we do</span>
            <h2>Sovereign compute for defense &amp; dual-use</h2>
        </div>

        <div class="grid grid--4">
            {% for item in site.data.capabilities %}
            <article class="card capability reveal">
                {% assign photo = '/img/photos/' | append: item.image | relative_url %}
                <img class="card__image" src="{{ photo }}.webp"
                     srcset="{{ photo }}-560.webp 560w, {{ photo }}.webp 800w"
                     sizes="(min-width: 1000px) 270px, (min-width: 620px) 50vw, 100vw"
                     alt="" width="800" height="534" loading="lazy">
                <div class="card__icon">{% include icon.html name=item.icon %}</div>
                <h3>{{ item.title }}</h3>
                <p>{{ item.summary }}</p>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
